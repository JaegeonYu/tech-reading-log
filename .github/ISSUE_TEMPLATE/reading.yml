name: 읽은 글 기록
description: 읽은 기술 블로그 글과 남기고 싶은 키워드, 문장을 기록합니다.
title: "[읽음] "
labels: [reading]
body:
  - type: input
    id: url
    attributes:
      label: 링크
      placeholder: https://
    validations:
      required: true
  - type: input
    id: title
    attributes:
      label: 글 제목
      description: 비워두면 이슈 제목을 사용합니다.
  - type: input
    id: keywords
    attributes:
      label: 키워드
      description: 쉼표로 구분합니다.
      placeholder: Kafka, 멱등성, exactly-once
    validations:
      required: true
  - type: textarea
    id: quotes
    attributes:
      label: 인상 깊은 문장
      description: 한 줄에 한 문장씩 적습니다.
  - type: textarea
    id: thoughts
    attributes:
      label: 내 생각
