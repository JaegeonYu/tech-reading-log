name: anthropic-wif-test
on: workflow_dispatch
permissions:
  id-token: write
  contents: read
jobs:
  call-claude:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch GitHub OIDC token
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken('https://api.anthropic.com');
            core.setSecret(token);
            core.exportVariable('JWT', token);
      - name: Exchange for an Anthropic access token
        run: |
          resp=$(curl -sS https://api.anthropic.com/v1/oauth/token \
            -H "content-type: application/json" \
            --data @- <<JSON
          {
            "grant_type": "urn:ietf:params:oauth:grant-type:jwt-bearer",
            "assertion": "$JWT",
            "federation_rule_id": "fdrl_0139NKews8hrSnmrWocYVcTj",
            "organization_id": "b1434750-25ba-4c98-ae3a-d25b3c5a9548",
            "service_account_id": "svac_01GKQ51J4yfydfb6kNZjX14A",
            "workspace_id": "wrkspc_01TKFk6Np7ng2UqcL3XbbLyC"
          }
          JSON
          )
          echo "$resp" | jq 'with_entries(if (.key | test("token$")) then .value = "<redacted>" else . end)'
          echo "$resp" | jq -e '.access_token | startswith("sk-ant-oat01-")' > /dev/null \
            || { echo "::error::토큰 교환 실패 — Console → Workload identity → History 탭에서 원인 확인"; exit 1; }
